# /etc/nginx/sites-available/storefront.conf  (host nginx, NOT in docker)
# HTTP-only on purpose: run certbot --nginx afterwards and it injects the
# 443 server block + the 80 -> 443 redirect into this same file.
#
#   sudo ln -s /etc/nginx/sites-available/storefront.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d technorextools.com -d www.technorextools.com --redirect

upstream storefront_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name technorextools.com www.technorextools.com;

    client_max_body_size 20m;

    # Certbot webroot challenge (also works before the cert exists).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Immutable build assets.
    location /_next/static/ {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
