# /etc/nginx/sites-available/abzar-storefront
# Reverse proxy for abzar/storefront (Next.js standalone on 127.0.0.1:3000).
# HTTP-only on purpose: certbot rewrites this file to add the TLS server block
# + the 80 -> 443 redirect.
#
#   ln -s /etc/nginx/sites-available/abzar-storefront /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d technorextools.com -d www.technorextools.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name technorextools.com www.technorextools.com;

    # Repair-request / media uploads proxied through the BFF.
    client_max_body_size 55m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/abzar-storefront.access.log;
    error_log  /var/log/nginx/abzar-storefront.error.log;

    # Certbot webroot challenge (also works before the cert exists).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Content-hashed build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
